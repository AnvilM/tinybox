version: '3'

set: [ errexit, nounset, pipefail ]


vars:
  APP_NAME: '{{.APP_NAME | default "app"}}'
  VERSION: '{{.VERSION | default "dev"}}'
  OUTPUT_DIR: '{{.OUTPUT_DIR | default "./build"}}'
  BINARY: '{{.APP_NAME}}-{{.VERSION}}-linux-x86_64'

tasks:
  build:
    desc: Собрать Linux x86_64 бинарник через Docker
    silent: true
    cmds:
      - echo "→ Building {{.BINARY}}..."
      - |
        docker build \
          --file docker/build.Dockerfile \
          --target export \
          --build-arg APP_NAME="{{.APP_NAME}}" \
          --build-arg VERSION="{{.VERSION}}" \
          --output "type=local,dest={{.OUTPUT_DIR}}" \
          .
      - chmod +x "{{.OUTPUT_DIR}}/{{.BINARY}}"
      - |
        echo ""
        echo "✓ Done: {{.OUTPUT_DIR}}/{{.BINARY}}"
        echo "  Size: $(du -sh "{{.OUTPUT_DIR}}/{{.BINARY}}" | cut -f1)"